routing:
  default: openai_primary
  models:
    openai_primary:
      model: openai:gpt-5.6-sol
      temperature: 0.0
    deepseek_docs:
      model: deepseek:deepseek-v4-flash
      temperature: 0.0
    anthropic_backup:
      model: anthropic:claude-sonnet-4-6
    openrouter_backup:
      model: openrouter:openai/gpt-5.5
  rules:
    - name: docs-on-deepseek
      model: deepseek_docs
      match:
        any_keywords: [README, docs, documentation, 文档]
        max_prompt_chars: 12000
  fallbacks: [anthropic_backup, openrouter_backup]
approvals:
  enabled: true
  minimum_risk: high
workspace:
  root: .
  shell_enabled: true
  inherit_environment: false
  allowed_environment: [PATH, LANG, LC_ALL, TERM]
state:
  directory: .caro
memory:
  enabled: true
  sources: [.caro/memory/AGENTS.md]
langfuse:
  enabled: true
  environment: local
  tags: [caro, multi-provider]
graph:
  stream_modes: [messages, updates, tasks, checkpoints]
